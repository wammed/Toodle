# Toodle cargo-deny configuration
#
# Audit policy:
# - Only explicitly identified SPDX licenses are allowed.
# - Upstream crates whose license is known but whose Cargo metadata is
#   incomplete are NOT silently whitelisted here.
# - Such metadata deficiencies are documented in
#   LICENSES/THIRD_PARTY_AUDIT.md and should be re-checked when the
#   corresponding dependency revision changes.
#
# cargo-deny: 0.20.2
# Last reviewed: 2026-09-21

[graph]
targets = []
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
ignore = []

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

confidence-threshold = 0.8

# Deliberately empty: these are not used to hide incomplete upstream
# license metadata.
exceptions = []

# Deliberately empty: the affected Git crates use repository-level license
# files outside the individual crate roots, so they cannot safely be expressed
# as crate-relative cargo-deny license-file clarifications.
clarify = []

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
allow-workspace = false
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
